[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "translate-comments"
version = "0.1.0"
description = "Translate English comments in source code to Chinese via local Ollama"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "requests>=2.31",
    "PySide6>=6.6",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
]

[project.scripts]
translate-comments     = "translate_comments.cli:main"
translate-comments-gui = "translate_comments.gui:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["translate_comments*"]
